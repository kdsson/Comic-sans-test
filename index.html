<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Sans Website</title>
    <style>
        /* 1. Register your local TTF file */
        @font-face {
            font-family: 'LocalComicSans';
            src: url('comic-sans.ttf') format('truetype');
        }

        /* 2. Apply it to the whole page */
        body {
            font-family: 'LocalComicSans', Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1>Welcome to my website!</h1>
    <p>This text is now using your custom Comic Sans TTF font.</p>

</body>
</html>
